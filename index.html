<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ficha RHB — Registro de socios</title>
<meta name="theme-color" content="#1e3a6e">
<script>try{if(localStorage.getItem('rhb_tema_v1')==='oscuro')document.documentElement.setAttribute('data-tema','oscuro');var _p=localStorage.getItem('rhb_paleta_v1');if(_p)document.documentElement.setAttribute('data-paleta',_p);}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ficha RHB">
<style>
/* ===== Colores (paleta azul por defecto) ===== */
:root{
  --g1:#1e3a6e; --g2:#3b3fb8; --g3:#0ea5a4; --acc:#4f46e5; --acc-txt:#4338ca; --acc-100:#e0e7ff;
  --bg:#f4f6fb; --card:#ffffff; --campo:#ffffff; --text:#0f172a; --muted:#64748b; --label:#475569; --div:#e5e9f2; --soft:#eef2f7;
  --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
  --sombra:0 3px 12px rgba(15,23,42,.06);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html[data-paleta="morado"]{--g1:#4c1d95; --g2:#7c3aed; --g3:#db2777; --acc:#7c3aed; --acc-txt:#6d28d9; --acc-100:#ede9fe}
html[data-paleta="verde"]{--g1:#064e3b; --g2:#059669; --g3:#84cc16; --acc:#059669; --acc-txt:#047857; --acc-100:#d1fae5}
html[data-paleta="naranja"]{--g1:#9a3412; --g2:#ea580c; --g3:#f59e0b; --acc:#ea580c; --acc-txt:#c2410c; --acc-100:#ffedd5}
html[data-paleta="rosado"]{--g1:#9d174d; --g2:#db2777; --g3:#f472b6; --acc:#db2777; --acc-txt:#be185d; --acc-100:#fce7f3}
html[data-paleta="negro"]{--g1:#000000; --g2:#18181b; --g3:#52525b; --acc:#18181b; --acc-txt:#18181b; --acc-100:#e4e4e7}
html[data-paleta="turquesa"]{--g1:#115e59; --g2:#0d9488; --g3:#22d3ee; --acc:#0d9488; --acc-txt:#0f766e; --acc-100:#ccfbf1}
html[data-paleta="amarillo"]{--g1:#a16207; --g2:#ca8a04; --g3:#facc15; --acc:#ca8a04; --acc-txt:#a16207; --acc-100:#fef9c3}
html[data-paleta="rojo"]{--g1:#7f1d1d; --g2:#dc2626; --g3:#f87171; --acc:#dc2626; --acc-txt:#b91c1c; --acc-100:#fee2e2}
html[data-tema="oscuro"]{color-scheme:dark;
  --bg:#0b1020; --card:#141a2e; --campo:#0f1526; --text:#e2e8f0; --muted:#94a3b8; --label:#cbd5e1; --div:#253049; --soft:#1c2439;
  --acc-txt:#a5b4fc; --acc-100:rgba(129,140,248,.16); --sombra:0 3px 12px rgba(0,0,0,.25)}
html[data-tema="oscuro"][data-paleta="morado"]{--acc-txt:#c4b5fd; --acc-100:rgba(167,139,250,.16)}
html[data-tema="oscuro"][data-paleta="verde"]{--acc-txt:#6ee7b7; --acc-100:rgba(52,211,153,.14)}
html[data-tema="oscuro"][data-paleta="naranja"]{--acc-txt:#fdba74; --acc-100:rgba(251,146,60,.15)}
html[data-tema="oscuro"][data-paleta="rosado"]{--acc-txt:#f9a8d4; --acc-100:rgba(244,114,182,.16)}
html[data-tema="oscuro"][data-paleta="negro"]{--acc:#a1a1aa; --acc-txt:#e4e4e7; --acc-100:rgba(255,255,255,.10)}
html[data-tema="oscuro"][data-paleta="negro"] .switch.on{background:#71717a}
html[data-tema="oscuro"][data-paleta="amarillo"]{--acc-txt:#fde047; --acc-100:rgba(250,204,21,.15)}
html[data-tema="oscuro"][data-paleta="rojo"]{--acc-txt:#fca5a5; --acc-100:rgba(248,113,113,.15)}
html[data-tema="oscuro"][data-paleta="turquesa"]{--acc-txt:#5eead4; --acc-100:rgba(45,212,191,.15)}
html[data-tema="oscuro"][data-paleta="negro"] header{background:linear-gradient(135deg,#000,#27272a 60%,#3f3f46)}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font-family:var(--font);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
html.tema-anim, html.tema-anim *{transition:background-color .3s ease,border-color .3s ease,color .3s ease !important}

/* ===== Encabezado ===== */
header{position:sticky;top:0;z-index:20;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);
  padding:calc(12px + env(safe-area-inset-top)) 18px 14px;border-radius:0 0 22px 22px;box-shadow:0 8px 24px rgba(15,23,42,.15)}
html[data-tema="oscuro"] header{background:linear-gradient(135deg,rgba(0,0,0,.35),rgba(0,0,0,.2)),linear-gradient(135deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%)}
header::after{content:"";position:absolute;right:-70px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
header.grande{position:relative;z-index:1;padding-bottom:40px}
.brand{font-size:10.5px;letter-spacing:.16em;font-weight:800;opacity:.78}
header h1{margin:3px 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em;padding-right:44px}
header.grande h1{font-size:25px}
.h-sub{font-size:13px;opacity:.88;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.18);padding:5px 11px;border-radius:99px;font-size:11.5px;font-weight:700;margin-top:9px;max-width:100%}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;flex:none}
.sync .dot.ok{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3)}
.sync .dot.pend{background:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.3)}
.sync .dot.mal{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.3)}
.sync .dot.gira{background:transparent;border:2px solid #fff;border-top-color:transparent;width:10px;height:10px;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.tema-btn{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s}
.tema-btn:active{transform:scale(.9)}
.tema-btn svg{width:18px;height:18px}
.tema-btn .i-sol{display:none}
html[data-tema="oscuro"] .tema-btn .i-luna{display:none}
html[data-tema="oscuro"] .tema-btn .i-sol{display:block}

/* ===== Contenido ===== */
main{flex:1;padding:0 0 120px}
main.entra{animation:entra .32s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding:16px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sec h3{font-size:15.5px;font-weight:800;margin:0}
.sec a,.link{font-size:12.5px;font-weight:800;color:var(--acc-txt);cursor:pointer;background:none;border:none;padding:0}
.muted{color:var(--muted)}
.count{font-size:12px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label,.lbl{display:block;font-size:11.5px;font-weight:800;letter-spacing:.03em;margin-bottom:6px;color:var(--label);text-transform:uppercase}
input,select,textarea{font-family:var(--font);font-size:15px}
.input{width:100%;padding:12px 13px;border:1.5px solid var(--div);border-radius:12px;background:var(--campo);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-100)}
textarea.input{min-height:86px;resize:vertical}
.field{margin-bottom:16px}
.box{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sombra)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;border:1.5px solid var(--div);cursor:pointer;font-weight:800;font-size:14px;background:var(--card);color:var(--acc-txt);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{border:none;color:#fff;background:linear-gradient(135deg,var(--g2),var(--g3));box-shadow:0 8px 18px rgba(79,70,229,.25)}
.btn-block{width:100%}
.btn-danger{color:var(--danger);border-color:rgba(220,38,38,.35)}
.btn-sm{padding:9px 12px;font-size:13px;border-radius:10px}
.btn-save{padding:15px;font-size:16px;border-radius:15px}
.back{display:inline-flex;align-items:center;gap:4px;border:none;background:none;color:var(--acc-txt);font-weight:800;font-size:14px;padding:4px 0;cursor:pointer}
.stack{display:flex;flex-direction:column;gap:10px}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:14px;background:var(--card);border-radius:18px;border:1.5px dashed var(--div)}
.empty .ico{font-size:34px;display:block;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}

/* ===== Estadísticas ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin:-28px 16px 0;position:relative;z-index:5}
.stat{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 8px 20px rgba(15,23,42,.08)}
.stat .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;margin-bottom:7px}
.stat .ic svg{width:16px;height:16px}
.stat .n{font-size:26px;font-weight:800;line-height:1.05}
.stat .l{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.bars{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar b{font-size:10.5px;color:var(--muted);font-weight:800}
.bar i{display:block;width:100%;border-radius:7px 7px 4px 4px;background:var(--acc-100);min-height:5px;transform-origin:bottom;animation:crece .6s cubic-bezier(.2,.8,.2,1) both}
.bar.hoy i{background:linear-gradient(180deg,var(--g2),var(--g3))}
.bar.hoy b{color:var(--acc-txt)}
.bar span{font-size:10.5px;font-weight:800;color:var(--muted)}
.bar.hoy span{color:var(--acc-txt)}
@keyframes crece{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hb{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;margin-top:10px}
.hb .nm{width:92px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.hb .tr{flex:1;height:10px;border-radius:9px;background:var(--soft);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:9px;transform-origin:left;animation:creceX .7s cubic-bezier(.2,.8,.2,1) both}
.hb .v{width:22px;text-align:right;font-weight:800}
@keyframes creceX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.esp-hoy{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.esp-hoy::-webkit-scrollbar{display:none}
.eh{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--muted);flex:none;position:relative}
.eh .num{position:absolute;top:-4px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--card);color:var(--text);font-size:11px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.15);padding:0 5px}

/* ===== Tarjetas de ficha ===== */
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14.5px;flex:none;letter-spacing:.02em}
.fc{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--text);border:none;border-radius:16px;padding:13px 13px 13px 16px;box-shadow:var(--sombra);position:relative;overflow:hidden;cursor:pointer;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,#94a3b8)}
.fc:active{filter:brightness(.97)}
.fc .tx{flex:1;min-width:0}
.fc .t{display:block;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .m{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fc .pills{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;align-items:center}
.fc .hora{font-size:12.5px;font-weight:800;color:var(--muted);flex:none}
.mini{display:inline-flex;gap:4px}
.mini i{width:22px;height:22px;border-radius:7px;display:grid;place-items:center}
.mini i svg{width:13px;height:13px}
.aparece{animation:entra .35s cubic-bezier(.2,.8,.2,1) backwards}
/* deslizar para editar / duplicar */
.sw{position:relative;border-radius:16px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:auto 100px}
.sw-acts{position:absolute;right:0;top:0;bottom:0;width:150px;display:flex}
.sw-acts button{flex:1;border:none;color:#fff;font-weight:800;font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.sw-acts svg{width:19px;height:19px}
.sw-acts .ed{background:var(--g2)}
.sw-acts .du{background:var(--g3)}
.sw.open .fc{transform:translateX(-150px)}
.dh{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.1em;margin:16px 4px 8px;text-transform:uppercase}
.dh:first-child{margin-top:4px}

/* ===== Buscador y filtros ===== */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:0 14px;box-shadow:var(--sombra);border:1.5px solid transparent}
.search:focus-within{border-color:var(--acc)}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input::-webkit-search-cancel-button{display:none}
.search input{-webkit-appearance:none;appearance:none;flex:1;border:none;background:transparent;padding:13px 0;color:var(--text);outline:none;min-width:0}
.filtros{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.fl{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:8px 13px;border-radius:99px;background:var(--card);color:var(--label);border:1.5px solid var(--div);cursor:pointer}
.fl .d{width:8px;height:8px;border-radius:50%}
.fl.on{background:var(--fc,var(--acc));border-color:var(--fc,var(--acc));color:#fff}
.fl.on .d{background:#fff !important}
.herr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.herr .btn{font-size:12.5px;padding:10px 8px}

/* ===== Formulario de ficha ===== */
.prog{display:flex;gap:6px;margin:12px 0 16px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--div);transition:background .3s}
.prog i.on{background:linear-gradient(90deg,var(--g2),var(--g3))}
.esp{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 6px;scrollbar-width:none}
.esp::-webkit-scrollbar{display:none}
.ep{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;font-weight:800;color:var(--label);border:none;background:none;padding:0;cursor:pointer;flex:none;transition:opacity .2s}
.ep .av{width:50px;height:50px;border-radius:50%;font-size:15px;transition:transform .2s,box-shadow .2s}
.esp.elegido .ep{opacity:.4}
.esp.elegido .ep.on{opacity:1}
.ep.on .av{transform:scale(1.06);box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--c)}
.seg{display:flex;background:var(--soft);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border:none;border-radius:10px;background:transparent;font-size:13.5px;font-weight:800;color:var(--muted);cursor:pointer;transition:all .2s}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--card);color:var(--c);box-shadow:0 2px 8px rgba(15,23,42,.12)}
.apg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.ap{position:relative;background:var(--card);border:1.5px solid var(--div);border-radius:15px;padding:11px 6px 10px;text-align:center;font-size:12px;font-weight:800;color:var(--label);cursor:pointer;transition:all .2s}
.ap .i{width:40px;height:40px;border-radius:13px;margin:0 auto 6px;display:grid;place-items:center;background:var(--soft);color:var(--c);transition:all .2s}
.ap .i svg{width:22px;height:22px}
.ap .ck{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;display:grid;place-items:center;transform:scale(0);transition:transform .2s cubic-bezier(.2,.9,.3,1.4)}
.ap.on{border-color:var(--c);color:var(--c);background:var(--cbg)}
.ap.on .i{background:var(--c);color:#fff;transform:scale(1.05)}
.ap.on .ck{transform:scale(1)}

/* ===== Detalle ===== */
.det-top{display:flex;gap:14px;align-items:center}
.det-top .av{width:58px;height:58px;border-radius:18px;font-size:19px}
.det-top h2{margin:0;font-size:20px;font-weight:800}
.drow{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:11px 0;border-bottom:1px solid var(--div)}
.drow:last-child{border-bottom:none}
.drow span:first-child{color:var(--muted);font-weight:600}
.drow span:last-child{font-weight:700;text-align:right}

/* ===== Ajustes ===== */
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.opt b{font-size:14.5px}
.opt small{display:block;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
.switch{width:52px;height:31px;border-radius:99px;background:var(--div);border:none;position:relative;cursor:pointer;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:linear-gradient(135deg,var(--g2),var(--g3))}
.switch.on::after{transform:translateX(21px)}
.paletas{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 4px;margin-top:12px;max-width:380px}
.pal{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:none;cursor:pointer;font-size:11.5px;font-weight:800;color:var(--label);padding:0}
.pal i{width:44px;height:44px;border-radius:50%;display:block;transition:transform .2s}
.pal.on i{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--acc);transform:scale(1.05)}
details.cfg summary{cursor:pointer;font-weight:800;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.cfg summary::-webkit-details-marker{display:none}
details.cfg summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details.cfg[open] summary::after{transform:rotate(90deg)}

/* ===== Barra inferior y botón Nueva ficha ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:720px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-around;
  background:var(--card);border-top:1px solid var(--div);padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(15,23,42,.08)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;font-size:10.5px;font-weight:800;color:var(--muted);padding:6px 0;cursor:pointer;transition:color .2s}
.tb svg{width:23px;height:23px;transition:transform .2s}
.tb.active{color:var(--acc-txt)}
.tb.active svg{transform:translateY(-2px) scale(1.08)}
.tb-esp{flex:1}
.fab{position:fixed;left:0;right:0;margin:0 auto;bottom:calc(30px + env(safe-area-inset-bottom));z-index:31;width:64px;height:64px;border-radius:22px;border:none;color:#fff;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0;overflow:hidden;isolation:isolate;
  background:linear-gradient(135deg,var(--g2),var(--g3));user-select:none;-webkit-user-select:none;

#splashRHB .linea svg{width:100%;height:100%}

#splashRHB .nucleo{position:relative;width:190px;height:190px;display:flex;align-items:center;justify-content:center}

#splashRHB .mono{position:relative;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.97);color:#1e3a6e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;box-shadow:0 0 0 6px rgba(255,255,255,.10),0 0 34px rgba(138,182,255,.75);animation:monoEntra .8s cubic-bezier(.2,.9,.2,1) both, latido 2.2s ease-in-out .8s infinite}

#splashRHB .barra{position:relative;width:160px;height:3px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
#splashRHB .barra i{position:absolute;inset:0;width:0;border-radius:99px;background:linear-gradient(90deg,#818cf8,#2dd4bf);box-shadow:0 0 14px rgba(138,182,255,.9);animation:carga 2.3s cubic-bezier(.4,0,.2,1) .25s forwards}

@keyframes mallaDeriva{to{background-position:26px 26px}}

@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){#splashRHB{animation-delay:.4s}}
</style>
</head>

<script>
/* Toque del botón Nueva ficha: responde al primer toque y evita dobles aperturas */
(function(){
  var fab=document.getElementById('fab'), ultimo=0, inicio=null;
  function abrir(){
    var t=Date.now(); if(t-ultimo<600) return; ultimo=t;
    fab.classList.add('press'); setTimeout(function(){fab.classList.remove('press');},180);
    if(navigator.vibrate){ try{navigator.vibrate(10);}catch(e){} }
    nuevaFicha();
  }
  function onda(x,y){
    var r=fab.getBoundingClientRect(), d=Math.max(r.width,r.height), s=document.createElement('span');
    s.className='ripple'; s.style.width=s.style.height=d+'px';
    s.style.left=((x==null?r.width/2:x-r.left)-d/2)+'px'; s.style.top=((y==null?r.height/2:y-r.top)-d/2)+'px';
    fab.appendChild(s); setTimeout(function(){ if(s.parentNode) s.parentNode.removeChild(s); },550);
  }
  fab.addEventListener('pointerdown',function(e){ inicio={x:e.clientX,y:e.clientY}; onda(e.clientX,e.clientY); fab.classList.add('press'); });
  fab.addEventListener('pointerup',function(e){
    fab.classList.remove('press');
    if(inicio && Math.abs(e.clientX-inicio.x)<30 && Math.abs(e.clientY-inicio.y)<30){ e.preventDefault(); abrir(); }
    inicio=null;
  });
  fab.addEventListener('pointercancel',function(){ inicio=null; fab.classList.remove('press'); });
  fab.addEventListener('click',function(e){ e.preventDefault(); abrir(); }); /* respaldo: teclado o navegadores antiguos */
})();
</script>

<script>

<script>
/* ============ almacenamiento permanente ============ */
var KEY='rhb_fichas_v1', CFGKEY='rhb_config_v1';
var DEFAULT_CFG={
  especialistas:['ANDREA','MILCA','GERMANIA','PAULA','INGRID'],
  sedes:['Sede Anexo','Sede Centro'],
  aparatos:['Ultrasonido','Magneto','Compresa','Láser','Percutor','Electrodos']
};
function load(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ alert('No se pudo guardar: '+e.message); } }
var fichas=load(KEY,[]);
var cfg=Object.assign({},DEFAULT_CFG,load(CFGKEY,{}));
try{ if(!localStorage.getItem('rhb_migra_electrodos')){ if(cfg.aparatos.indexOf('Electrodos')<0){ cfg.aparatos.push('Electrodos'); save(CFGKEY,cfg); } localStorage.setItem('rhb_migra_electrodos','1'); } }catch(e){}
function persist(){ save(KEY,fichas); }
function persistCfg(){ save(CFGKEY,cfg); }

/* ============ sincronización con la hoja de Google ============ */
var SYNC_URL='https://script.google.com/macros/s/AKfycbxjhDnPG4WwVL1pQV_AGIP3ai6IUCgAimcZvUAWep5Il8Nl-BEBbne38kFday0b-nHf2Q/exec';
var CLAVEKEY='rhb_clave_v1', COLAKEY='rhb_cola_v1', COLABKEY='rhb_cola_borrar_v1';
var clave=load(CLAVEKEY,'');
var cola=load(COLAKEY,[]);        // ids pendientes de subir
var colaBorrar=load(COLABKEY,[]); // ids pendientes de borrar
var estadoSync={texto:'', tipo:''}, sincronizando=false;
function persistCola(){ save(COLAKEY,cola); save(COLABKEY,colaBorrar); }
function encolar(id){ if(cola.indexOf(id)<0) cola.push(id); persistCola(); }

function jsonp(url){
  return new Promise(function(res,rej){
    var cb='rhbcb'+Math.random().toString(36).slice(2);
    var s=document.createElement('script');
    var t=setTimeout(function(){ limpiar(); rej(new Error('tiempo agotado')); }, 20000);
    function limpiar(){ clearTimeout(t); try{delete window[cb];}catch(e){} if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(d){ limpiar(); res(d); };
    s.onerror=function(){ limpiar(); rej(new Error('sin conexión')); };
    s.src=url+(url.indexOf('?')<0?'?':'&')+'callback='+cb;
    document.body.appendChild(s);
  });
}

function enviar(cuerpo){
  cuerpo.clave=clave;
  var opciones={method:'POST', body:JSON.stringify(cuerpo), headers:{'Content-Type':'text/plain;charset=utf-8'}};
  return fetch(SYNC_URL,opciones).then(function(r){ return r.json(); })
    .catch(function(){ return fetch(SYNC_URL,Object.assign({mode:'no-cors'},opciones)).then(function(){ return {ok:true,ciego:true}; }); });
}

function marcarEstado(texto,tipo){ estadoSync={texto:texto,tipo:tipo||''}; pintarEstado(); }

function sincronizar(silencioso){
  if(!clave || sincronizando) return Promise.resolve();
  sincronizando=true;
  marcarEstado('Sincronizando…','');
  var pendientes=fichas.filter(function(f){ return cola.indexOf(f.id)>=0; });
  var paso=Promise.resolve();
  if(colaBorrar.length){
    paso=paso.then(function(){
      return Promise.all(colaBorrar.map(function(id){ return enviar({accion:'borrar',id:id}); }))
        .then(function(){ colaBorrar=[]; persistCola(); });
    });
  }
  if(pendientes.length){
    paso=paso.then(function(){
      return enviar({accion:'guardar',fichas:pendientes}).then(function(r){
        if(r && r.ok){ cola=cola.filter(function(id){ return pendientes.every(function(f){return f.id!==id;}); }); persistCola(); }
      });
    });
  }
  return paso.then(function(){
    return jsonp(SYNC_URL+'?clave='+encodeURIComponent(clave));
  }).then(function(r){
    if(!r || !r.ok) throw new Error(r && r.error ? r.error : 'respuesta inválida');
    var pendSet={}; cola.forEach(function(id){ pendSet[id]=1; });
    var locales={}; fichas.forEach(function(f){ locales[f.id]=f; });
    var nuevas=r.fichas.slice();
    // conservar las que aún no se han subido
    fichas.forEach(function(f){ if(pendSet[f.id] && !r.fichas.some(function(x){return x.id===f.id;})) nuevas.push(f); });
    fichas=nuevas; persist();
    sincronizando=false;
    marcarEstado('Al día · '+fichas.length+' ficha'+(fichas.length===1?'':'s'),'ok');
    if(!silencioso) render();
    else if(view==='historial') renderListaHist();
    else if(view==='inicio'||view==='agenda'||view==='estadisticas'){ var _y=window.scrollY; render(); window.scrollTo(0,_y); }
  }).catch(function(err){
    sincronizando=false;
    var msg=String(err.message||err);
    if(msg.indexOf('clave')>=0){ marcarEstado('Clave incorrecta','mal'); }
    else marcarEstado('Sin conexión · '+cola.length+' por subir','pend');
  });
}

function pintarEstado(){
  var el=document.getElementById('barraSync'), dot=document.getElementById('syncDot');
  if(!el) return;
  el.textContent=estadoSync.texto||(clave?'Conectando…':'Sin conectar');
  if(dot) dot.className='dot '+(estadoSync.tipo||(sincronizando?'gira':''));
}

/* ============ utilidades ============ */
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function fechaLarga(iso){ if(!iso) return ''; var a=iso.split('-'); var d=new Date(+a[0],+a[1]-1,+a[2]); return DIAS[d.getDay()]+' '+(+a[2])+' de '+MESES[+a[1]-1]+' '+a[0]; }
function fechaCorta(iso){ if(!iso) return ''; var a=iso.split('-'); return (+a[2])+'/'+(+a[1])+'/'+a[0]; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uid(){ return 'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){ var t=document.getElementById('toast'); document.getElementById('toastTxt').textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},2200); }

/* ============ estado de vista ============ */
var view='inicio', diaSel=hoyISO(), busqueda='', draft=null, detalleId=null;

function go(v){
  view=v;
  document.getElementById('tabInicio').classList.toggle('active', v==='inicio');
  document.getElementById('tabAgenda').classList.toggle('active', v==='agenda'||v==='ficha');
  document.getElementById('tabHistorial').classList.toggle('active', v==='historial'||v==='detalle');
  document.getElementById('tabAjustes').classList.toggle('active', v==='ajustes');
  document.getElementById('temaBtn').classList.toggle('activo', v==='estadisticas');
  render();
}

function nuevaFicha(){
  draft={ id:null, fecha:(view==='agenda'?diaSel:hoyISO()), hora:horaActual(), nombre:'', cedula:'', socio:'', especialista:'', sede:'', concepto:'', aparatos:[] };
  view='ficha'; render();
}
function horaActual(){ var d=new Date(); return p2(d.getHours())+':'+p2(d.getMinutes()); }
function editar(id){ var f=fichas.find(function(x){return x.id===id;}); if(!f) return; draft=JSON.parse(JSON.stringify(f)); view='ficha'; render(); }

function guardar(){
  if(!draft.nombre.trim()){ alert('Escribe el nombre del socio.'); return; }
  if(draft.id){
    var i=fichas.findIndex(function(x){return x.id===draft.id;});
    if(i>=0){ draft.actualizado=new Date().toISOString(); fichas[i]=draft; }
  }else{
    draft.id=uid(); draft.creado=new Date().toISOString(); fichas.push(draft);
  }
  persist(); encolar(draft.id); diaSel=draft.fecha; draft=null; view='agenda'; render(); toast('Ficha guardada');
  sincronizar(true);
}

function borrar(id){
  if(!confirm('¿Eliminar esta ficha? No se puede deshacer.')) return;
  fichas=fichas.filter(function(x){return x.id!==id;});
  cola=cola.filter(function(c){return c!==id;});
  if(colaBorrar.indexOf(id)<0) colaBorrar.push(id);
  persist(); persistCola(); view='historial'; render(); toast('Ficha eliminada');
  sincronizar(true);
}


/* ============ colores, íconos y ayudas visuales (solo diseño) ============ */
var ESP_COL=['#7c3aed','#e11d74','#0284c7','#16a34a','#f59e0b','#0d9488','#ea580c','#4f46e5','#be123c','#65a30d'];
var SEDE_COL=['#0d9488','#ea580c','#2563eb','#db2777','#7c3aed','#65a30d'];
var APAR_INFO={ultrasonido:['us','#0284c7'],magneto:['mag','#7c3aed'],compresa:['comp','#ea580c'],laser:['las','#dc2626'],percutor:['per','#0d9488'],electrodos:['ele','#d97706']};
var APAR_EXTRA=['#4f46e5','#db2777','#16a34a','#0891b2','#9333ea','#ca8a04'];
function hashTxt(s){ var h=0; s=String(s||''); for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
function colorEsp(n){ if(!n) return '#94a3b8'; var i=cfg.especialistas.indexOf(n); if(i<0) i=hashTxt(n); return ESP_COL[i%ESP_COL.length]; }
function colorSede(n){ if(!n) return '#94a3b8'; var i=cfg.sedes.indexOf(n); if(i<0) i=hashTxt(n); return SEDE_COL[i%SEDE_COL.length]; }
function infoAparato(a){
  var k=normTxt(a).trim(); if(APAR_INFO[k]) return {ico:APAR_INFO[k][0],c:APAR_INFO[k][1]};
  for(var key in APAR_INFO){ if(k.indexOf(key)>=0) return {ico:APAR_INFO[key][0],c:APAR_INFO[key][1]}; }
  return {ico:'gen',c:APAR_EXTRA[hashTxt(k)%APAR_EXTRA.length]};
}
function ico(n,extra){ return '<svg'+(extra||'')+'><use href="#i-'+n+'"/></svg>'; }
function iniciales(nombre){
  var p=String(nombre||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return ((p[0][0]||'')+(p.length>1?p[1][0]:(p[0][1]||''))).toUpperCase();
}
function iniEsp(n){ return String(n||'?').trim().slice(0,2).toUpperCase(); }
function sedeCorta(s){ return String(s||'').replace(/^sede\s+/i,'') || 'Sin sede'; }
function pillSede(s){ if(!s) return ''; var c=colorSede(s); return '<span class="pill" style="background:'+c+'1f;color:'+c+'">'+esc(sedeCorta(s))+'</span>'; }
function miniAparatos(lista){
  lista=lista||[]; if(!lista.length) return '';
  return '<span class="mini">'+lista.slice(0,5).map(function(a){ var i=infoAparato(a); return '<i title="'+esc(a)+'" style="background:'+i.c+'1f;color:'+i.c+'">'+ico(i.ico)+'</i>'; }).join('')+'</span>';
}
function plural(n,s,p){ return n+' '+(n===1?s:(p||s+'s')); }
function saludo(){ var h=new Date().getHours(); return h<12?'Buenos días ☀️':(h<19?'Buenas tardes 🌤️':'Buenas noches 🌙'); }
function sumarDias(iso,n){ var a=iso.split('-'); var d=new Date(+a[0],+a[1]-1,+a[2]+n); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function tituloDia(iso){ var h=hoyISO(); if(iso===h) return 'Hoy'; if(iso===sumarDias(h,-1)) return 'Ayer'; return fechaLarga(iso); }

/* tarjeta de ficha (misma en agenda, inicio e historial) */
function tarjeta(f,i,conFecha,liviana){
  var c=colorEsp(f.especialista), n=(f.aparatos||[]).length;
  return '<button class="fc'+(i!=null&&i<12?' aparece':'')+'" style="--c:'+c+(i!=null&&i<12?';animation-delay:'+(i*35)+'ms':'')+'" onclick="abrirDetalle(\''+f.id+'\',this)">'
    +'<span class="av" style="background:'+c+'">'+esc(iniciales(f.nombre))+'</span>'
    +'<span class="tx"><span class="t">'+esc(f.nombre)+'</span>'
    +'<span class="m">'+esc(f.concepto||'Sin concepto registrado')+'</span>'
    +'<span class="pills"><span class="pill" style="background:'+c+'1f;color:'+c+'">'+esc(f.especialista||'Sin especialista')+'</span>'+pillSede(f.sede)
    +(n?(liviana?'<span class="pill" style="background:var(--soft);color:var(--muted)">'+plural(n,'aparato')+'</span>':miniAparatos(f.aparatos)):'')+'</span></span>'
    +'<span class="hora">'+(conFecha?esc(fechaCorta(f.fecha))+'<br>':'')+esc(f.hora||'')+'</span>'
    +'</button>';
}
function tarjetaSwipe(f,i,conFecha){
  return '<div class="sw"><div class="sw-acts">'
    +'<button class="ed" onclick="editar(\''+f.id+'\')"><span style="font-size:18px">✎</span>Editar</button>'
    +'<button class="du" onclick="duplicar(\''+f.id+'\')"><span style="font-size:18px">⧉</span>Duplicar</button>'
    +'</div>'+tarjeta(f,i,!!conFecha,true)+'</div>';
}
function abrirDetalle(id,el){
  if(el){
    if(el._skip && Date.now()-el._skip<350) return;
    var sw=el.parentNode;
    if(sw && sw.classList && sw.classList.contains('open')){ sw.classList.remove('open'); return; }
  }
  detalleId=id; view='detalle'; render();
}
function duplicar(id){
  var f=fichas.find(function(x){return x.id===id;}); if(!f) return;
  draft={ id:null, fecha:hoyISO(), hora:horaActual(), nombre:f.nombre||'', cedula:f.cedula||'', socio:f.socio||'',
          especialista:f.especialista||'', sede:f.sede||'', concepto:f.concepto||'', aparatos:(f.aparatos||[]).slice() };
  view='ficha'; render(); toast('Ficha duplicada · revisa y guarda');
}

/* deslizar la tarjeta hacia la izquierda para ver Editar / Duplicar */
(function(){
  var s=null;
  function cerrarOtras(salvo){ Array.prototype.forEach.call(document.querySelectorAll('.sw.open'),function(w){ if(w!==salvo) w.classList.remove('open'); }); }
  document.addEventListener('pointerdown',function(e){
    var c=e.target.closest && e.target.closest('.sw .fc');
    cerrarOtras(c?c.parentNode:(e.target.closest&&e.target.closest('.sw')));
    if(!c) return;
    s={el:c,x:e.clientX,y:e.clientY,base:c.parentNode.classList.contains('open')?-150:0,mov:false,dx:0};
  });
  document.addEventListener('pointermove',function(e){
    if(!s) return;
    var dx=e.clientX-s.x, dy=e.clientY-s.y;
    if(!s.mov){ if(Math.abs(dy)>10 && Math.abs(dy)>=Math.abs(dx)){ s=null; return; } if(Math.abs(dx)>20 && Math.abs(dx)>Math.abs(dy)*1.5) s.mov=true; else return; }
    s.dx=dx; var t=Math.max(-160,Math.min(0,s.base+dx));
    s.el.style.transition='none'; s.el.style.transform='translateX('+t+'px)';
  });
  function fin(){
    if(!s) return;
    if(s.mov){
      var abierto=(s.base+s.dx)<-70;
      s.el.style.transition=''; s.el.style.transform='';
      s.el.parentNode.classList.toggle('open',abierto);
      s.el._skip=Date.now();
      if(abierto && navigator.vibrate){ try{navigator.vibrate(8);}catch(e){} }
    }
    s=null;
  }
  document.addEventListener('pointerup',fin);
  document.addEventListener('pointercancel',fin);
})();

/* números que suben al entrar al Inicio */
function animarNumeros(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-num]'),function(el){
    var fin=+el.getAttribute('data-num'), t0=null, dur=650;
    if(!fin){ el.textContent='0'; return; }
    function paso(t){ if(!t0) t0=t; var k=Math.min(1,(t-t0)/dur); el.textContent=Math.round(fin*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(paso); }
    requestAnimationFrame(paso);
  });
}

/* ============ render ============ */
function vistaClave(){
  return '<div class="pad" style="padding-top:26px"><div class="box" style="padding:22px">'
   + '<div class="av" style="width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,var(--g2),var(--g3));margin-bottom:14px;font-size:22px">🔒</div>'
   + '<h2 style="margin:0 0 4px;font-size:20px">Ingresa la clave del centro</h2>'
   + '<p class="muted" style="font-size:13.5px;margin:0 0 18px">Te la da Luis. Solo se pide una vez en este teléfono.</p>'
   + '<div class="field"><input class="input" id="inputClave" type="password" placeholder="Clave" onkeydown="if(event.key===\'Enter\')entrarClave()"></div>'
   + '<button class="btn btn-primary btn-block btn-save" onclick="entrarClave()">Entrar</button>'
   + '<div id="errClave" style="color:var(--danger);font-size:13px;margin-top:10px;font-weight:700"></div></div></div>';
}
function entrarClave(){
  var v=document.getElementById('inputClave').value.trim();
  if(!v) return;
  document.getElementById('errClave').textContent='Comprobando…';
  clave=v;
  jsonp(SYNC_URL+'?clave='+encodeURIComponent(v)).then(function(r){
    if(r && r.ok){ save(CLAVEKEY,v); fichas=r.fichas; persist(); marcarEstado('Al día · '+plural(fichas.length,'ficha'),'ok'); view='inicio'; render(); toast('Conectado'); }
    else { clave=''; document.getElementById('errClave').textContent='Clave incorrecta.'; }
  }).catch(function(){ clave=''; document.getElementById('errClave').textContent='No hay conexión. Intenta de nuevo.'; });
}

var vistaPrevia=null;
function pintarHeader(){
  var hdr=document.getElementById('hdr'), t=document.getElementById('hdrTitulo'), s=document.getElementById('hdrSub');
  var grande=(view==='inicio' && !!clave);
  hdr.classList.toggle('grande',grande);
  if(!clave){ t.textContent='Ficha RHB'; s.textContent='Registro de socios'; return; }
  var titulos={estadisticas:'Estadísticas',agenda:'Agenda',historial:'Historial',ajustes:'Ajustes',detalle:'Detalle de ficha'};

function normTxt(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
/* búsqueda: como antes (nombre, cédula, N° de socio o especialista, sin importar tildes ni mayúsculas),
   y además acepta varias palabras en cualquier orden: "maria rodri", "rodriguez maria" */
var _cacheBusq={};
function textoBusq(f){
  var c=_cacheBusq[f.id], k=f.nombre+'|'+f.cedula+'|'+f.socio+'|'+f.especialista;
  if(!c || c.k!==k){ c=_cacheBusq[f.id]={k:k,t:[f.nombre,f.cedula,f.socio,f.especialista].map(normTxt).join(' ')}; }
  return c.t;
}
function coincide(f,q){
  var texto=textoBusq(f);
  return q.split(/\s+/).filter(Boolean).every(function(p){ return texto.indexOf(p)>=0; });
}

var filtroEsp='', filtroSede='', histLimite=30, _tBusca=null;
function listaFiltrada(){
  var q=normTxt(busqueda.trim());
  var list=fichas.slice().sort(function(a,b){ return (b.fecha+' '+(b.hora||'')).localeCompare(a.fecha+' '+(a.hora||'')); });
  if(q) list=list.filter(function(f){ return coincide(f,q); });
  if(filtroEsp) list=list.filter(function(f){ return f.especialista===filtroEsp; });
  if(filtroSede) list=list.filter(function(f){ return f.sede===filtroSede; });
  return list;
}

function descargar(blob,nombre){
  var url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},1500);
}
function stamp(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }

function exportarCSV(){
  if(!fichas.length){ alert('Todavía no hay fichas para exportar.'); return; }
  var csv=filas().map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
  descargar(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),'fichas_rehabilitacion_'+stamp()+'.csv');
  toast('CSV descargado');
}

function exportarExcel(){
  if(!fichas.length){ alert('Todavía no hay fichas para exportar.'); return; }
  var rows=filas();
  descargar(new Blob([construirXLSX(rows)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
            'fichas_rehabilitacion_'+stamp()+'.xlsx');
  toast('Excel descargado');
}

function respaldar(){
  descargar(new Blob([JSON.stringify({fichas:fichas,cfg:cfg},null,2)],{type:'application/json'}),'respaldo_fichas_'+stamp()+'.json');
  toast('Respaldo guardado');
}
function restaurar(input){
  var file=input.files[0]; if(!file) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var data=JSON.parse(r.result);
      if(!data.fichas) throw new Error('Archivo no válido');
      if(!confirm('Se agregarán '+data.fichas.length+' fichas del respaldo. ¿Continuar?')) return;
      var ids={}; fichas.forEach(function(f){ids[f.id]=1;});
      data.fichas.forEach(function(f){ if(!ids[f.id]) fichas.push(f); });
      if(data.cfg) cfg=Object.assign(cfg,data.cfg);
      persist(); persistCfg(); render(); toast('Respaldo restaurado');
    }catch(e){ alert('No se pudo restaurar: '+e.message); }
  };
  r.readAsText(file); input.value='';
}

/* ---- generador .xlsx nativo (sin internet, sin librerías) ---- */
function xmlEsc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function colName(n){ var s=''; while(n>0){ var m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }
function hojaXML(rows){
  var out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
   +'<sheetPr><outlinePr summaryBelow="1" summaryRight="1"/></sheetPr>'
   +'<cols><col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="8" customWidth="1"/>'
   +'<col min="3" max="3" width="30" customWidth="1"/><col min="4" max="4" width="16" customWidth="1"/>'
   +'<col min="5" max="5" width="14" customWidth="1"/><col min="6" max="6" width="16" customWidth="1"/>'
   +'<col min="7" max="7" width="16" customWidth="1"/><col min="8" max="8" width="52" customWidth="1"/>'
   +'<col min="9" max="9" width="34" customWidth="1"/></cols><sheetData>';
  rows.forEach(function(row,ri){
    out+='<row r="'+(ri+1)+'">';
    row.forEach(function(val,ci){
      var ref=colName(ci+1)+(ri+1);
      var s=ri===0?' s="1"':'';
      out+='<c r="'+ref+'"'+s+' t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(val)+'</t></is></c>';
    });
    out+='</row>';
  });
  out+='</sheetData><autoFilter ref="A1:'+colName(rows[0].length)+rows.length+'"/></worksheet>';
  return out;
}
function construirXLSX(rows){
  var files={};
  files['[Content_Types].xml']='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
   +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
   +'<Default Extension="xml" ContentType="application/xml"/>'
   +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
   +'<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
   +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
   +'</Types>';
  files['_rels/.rels']='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
   +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
   +'</Relationships>';
  files['xl/workbook.xml']='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
   +'<sheets><sheet name="Fichas" sheetId="1" r:id="rId1"/></sheets></workbook>';
  files['xl/_rels/workbook.xml.rels']='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
   +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
   +'<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
   +'</Relationships>';
  files['xl/styles.xml']='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
   +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
   +'<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
   +'<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts>'
   +'<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'
   +'<fill><patternFill patternType="solid"><fgColor rgb="FF1E3A6E"/><bgColor indexed="64"/></patternFill></fill></fills>'
   +'<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'
   +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
   +'<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
   +'<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs>'
   +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
   +'<dxfs count="0"/>'
   +'</styleSheet>';
  files['xl/worksheets/sheet1.xml']=hojaXML(rows);
  return zipStore(files);
}
var CRC_TABLE=(function(){ var t=new Uint32Array(256); for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(bytes){ var c=0xFFFFFFFF; for(var i=0;i<bytes.length;i++) c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function utf8(str){ return new TextEncoder().encode(str); }
function zipStore(files){
  var names=Object.keys(files), parts=[], central=[], offset=0;
  function u16(n){ return [n&255,(n>>8)&255]; }
  function u32(n){ return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255]; }
  names.forEach(function(name){
    var nameB=utf8(name), data=utf8(files[name]), crc=crc32(data);
    var local=[].concat([80,75,3,4],u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    parts.push(new Uint8Array(local), nameB, data);
    central.push({nameB:nameB,crc:crc,size:data.length,offset:offset});
    offset+=local.length+nameB.length+data.length;
  });
  var cdStart=offset, cdParts=[];
  central.forEach(function(e){
    var h=[].concat([80,75,1,2],u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),u32(e.crc),u32(e.size),u32(e.size),
      u16(e.nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(e.offset));
    cdParts.push(new Uint8Array(h), e.nameB);
    offset+=h.length+e.nameB.length;
  });
  var end=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(central.length),u16(central.length),u32(offset-cdStart),u32(cdStart),u16(0)));
  var all=parts.concat(cdParts,[end]);
  var total=all.reduce(function(a,b){return a+b.length;},0);
  var out=new Uint8Array(total), pos=0;
  all.forEach(function(chunk){ out.set(chunk,pos); pos+=chunk.length; });
  return out;
}
